name: Vendor payment recovery
on:
  push:
    branches: ['fix/vendor-payment-reconciliation-20261014']
    paths: ['.github/workflows/payment-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vendor-payment-recovery
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/functions/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ourweddingdayhub
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ourweddingdayhub
      - name: Install dependencies
        run: npm ci
        working-directory: docs/functions
      - name: Regression tests
        run: npm test
        working-directory: docs/functions
      - name: Read-only Stripe and vendor audit
        run: node reconcile-vendors.js
        working-directory: docs/functions
