name: Membership regression checks
on:
  pull_request:
    paths: ['docs/functions/**', 'docs/firebase.js', 'docs/firebase.json', 'docs/firestore.rules', 'security/**', 'docs/signup.html', 'docs/payment-*.html', 'docs/dashboard.html', '.github/workflows/membership-tests.yml']
  push:
    paths: ['docs/functions/**', 'docs/firebase.js', 'docs/firebase.json', 'docs/firestore.rules', 'security/**', 'docs/signup.html', 'docs/payment-*.html', 'docs/dashboard.html', '.github/workflows/membership-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/functions/package-lock.json
      - run: npm ci
        working-directory: docs/functions
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: docs/functions
      - name: Verify native image dependency
        run: node -e 'require("sharp"); console.log("Native image dependency loaded")'
        working-directory: docs/functions
      - run: npm test
        working-directory: docs/functions
      - name: Confirm invitation frontend has no browser-issued paid or free flags
        run: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("docs/signup.html","utf8"); if(s.includes("foundingvendor2026") || /paymentStatus:\s*isFreeInvite/.test(s))process.exit(1)'
      - name: Verify live membership routes after main updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node docs/functions/check-membership-deployment.js
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
        working-directory: security
      - run: npm test
        working-directory: security
